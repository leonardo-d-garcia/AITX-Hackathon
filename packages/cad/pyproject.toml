[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronebench-cad"
version = "0.1.0"
description = "Parametric CadQuery reconstruction, export and round-trip verification for DroneBench Studio (Team A, deliverable A2)"
requires-python = ">=3.11"
dependencies = [
    "cadquery>=2.8",
    "numpy>=1.26",
    "pydantic>=2",
    "pyyaml>=6",
    "trimesh>=4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dronebench_cad*"]

[tool.setuptools.package-data]
dronebench_cad = ["params.yaml"]
